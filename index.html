<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Blattflip – die einfache Schulbibliothek</title>
    <meta name="description" content="Blattflip – die einfache Schulbibliothek.">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;450;500;600;700;750;800&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            min-height: 100%;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;

            font-family: "Manrope", sans-serif;

            background: #f8f6ef;
            color: #20201e;
        }

        .container {
            text-align: center;
            padding: 40px 24px 90px;
        }

        .logo {
            position: relative;
            display: inline-block;
        }

        h1 {
            margin: 0;
            font-size: clamp(4rem, 12vw, 7rem);
            line-height: 0.95;
            font-weight: 800;
            letter-spacing: -0.07em;
        }

        /* Abstract page fold / kite */
        .flip {
            position: absolute;
            width: 38px;
            height: 38px;
            top: -17px;
            right: -31px;
            border-radius: 3px 14px 3px 14px;
            background:
                linear-gradient(
                    135deg,
                    #ff6b57 0 33%,
                    #ffd84d 33% 66%,
                    #6fc7b5 66%
                );
            transform: rotate(13deg);
        }

        .claim {
            margin: 24px 0 0;
            font-size: clamp(1.25rem, 3vw, 1.7rem);
            font-weight: 500;
            letter-spacing: -0.02em;
        }

        footer {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 22px;
            display: flex;
            justify-content: center;
            gap: 18px;
            font-size: 0.82rem;
        }

        footer a {
            color: #77736b;
            text-decoration: none;
        }

        footer a:hover,
        footer a:focus-visible {
            color: #20201e;
            text-decoration: underline;
        }

        @media (max-width: 520px) {
            .flip {
                width: 30px;
                height: 30px;
                top: -13px;
                right: -23px;
            }
        }
    </style>
</head>

<body>
    <main class="container">
        <div class="logo">
            <h1>blattflip</h1>
            <span class="flip" aria-hidden="true"></span>
        </div>

        <p class="claim">die einfache Schulbibliothek</p>
    </main>

    <footer>
        <a href="impressum.html">Impressum</a>
        <a href="datenschutz.html">Datenschutz</a>
    </footer>
</body>
</html>
