<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Blattflip – die einfache Schulbibliothek</title>
    <meta
        name="description"
        content="Blattflip – die einfache Schulbibliothek."
    >

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;

            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                         Roboto, Helvetica, Arial, sans-serif;

            background: #f8f6ef;
            color: #20201e;
        }

        .container {
            text-align: center;
            padding: 40px 24px;
        }

        .logo {
            position: relative;
            display: inline-block;
        }

        h1 {
            margin: 0;
            font-size: clamp(4rem, 12vw, 7rem);
            line-height: 0.95;
            font-weight: 750;
            letter-spacing: -0.07em;
        }

        /* little "page flip" */
        .flip {
            position: absolute;
            width: 38px;
            height: 38px;
            top: -17px;
            right: -31px;
            border-radius: 3px 14px 3px 14px;
            background:
                linear-gradient(
                    135deg,
                    #ff6b57 0 33%,
                    #ffd84d 33% 66%,
                    #6fc7b5 66%
                );
            transform: rotate(13deg);
        }

        p {
            margin: 24px 0 0;
            font-size: clamp(1.25rem, 3vw, 1.7rem);
            font-weight: 450;
            letter-spacing: -0.02em;
        }

        .origin {
            margin-top: 14px;
            font-size: 0.9rem;
            color: #77736b;
        }
    </style>
</head>

<body>
    <main class="container">
        <div class="logo">
            <h1>blattflip</h1>
            <span class="flip" aria-hidden="true"></span>
        </div>

        <p>die einfache Schulbibliothek</p>
        <div class="origin">Für Schulen in Deutschland entwickelt.</div>
    </main>
</body>
</html>
